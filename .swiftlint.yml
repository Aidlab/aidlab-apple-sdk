# SwiftLint configuration for Aidlab Apple SDK
# Focus on catching unsafe constructs

included:
  - .

opt_in_rules:
  - force_unwrapping
  - force_cast
  - force_try
  - implicitly_unwrapped_optional
  - discouraged_optional_collection

disabled_rules:
  - line_length
  - identifier_name

cyclomatic_complexity:
  warning: 20
  error: 30

file_length:
  warning: 1500
  error: 1800

function_body_length:
  warning: 150
  error: 250

function_parameter_count:
  warning: 8
  error: 12

type_body_length:
  warning: 1200
  error: 1500
